<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solar</title>
    <link rel="icon" type="image/png" href="sist.png">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- CSS -->
    <link rel="stylesheet" href="css/solar-style.css">
</head>

<body>

    <div class="stars"></div>
    <div class="twinkling"></div>

    <header class="main-header">
        <h1>Sistema Solar</h1>
        <p>Clique nos planetas para desvendar mais informações</p>
    </header>

    <main class="solar-system">
        <div class="sun"></div>

        <!-- Orbits and Planters will be generated by JS or defined here. 
             Let's define them explicitly for easier CSS control initially. -->

        <div class="orbit mercury-orbit">
            <div class="planet mercury" data-planet="mercury">
                <div class="planet-visual"></div>
            </div>
        </div>

        <div class="orbit venus-orbit">
            <div class="planet venus" data-planet="venus">
                <div class="planet-visual"></div>
            </div>
        </div>

        <div class="orbit earth-orbit">
            <div class="planet earth" data-planet="earth">
                <div class="moon-orbit">
                    <div class="moon"></div>
                </div>
                <div class="planet-visual"></div>
            </div>
        </div>

        <div class="orbit mars-orbit">
            <div class="planet mars" data-planet="mars">
                <div class="moon-orbit mars-moon1-orbit">
                    <div class="moon mars-moon"></div>
                </div>
                <div class="moon-orbit mars-moon2-orbit">
                    <div class="moon mars-moon"></div>
                </div>
                <div class="planet-visual"></div>
            </div>
        </div>

        <div class="orbit jupiter-orbit">
            <div class="planet jupiter" data-planet="jupiter">
                <div class="moon-orbit jupiter-moon1-orbit">
                    <div class="moon jupiter-moon"></div>
                </div>
                <div class="moon-orbit jupiter-moon2-orbit">
                    <div class="moon jupiter-moon"></div>
                </div>
                <div class="moon-orbit jupiter-moon3-orbit">
                    <div class="moon jupiter-moon"></div>
                </div>
                <div class="moon-orbit jupiter-moon4-orbit">
                    <div class="moon jupiter-moon"></div>
                </div>
                <div class="planet-visual"></div>
            </div>
        </div>

        <div class="orbit saturn-orbit">
            <div class="planet saturn" data-planet="saturn">
                <div class="moon-orbit saturn-moon-orbit">
                    <div class="moon saturn-moon"></div>
                </div>
                <div class="ring"></div>
                <div class="planet-visual"></div>
            </div>
        </div>

        <div class="orbit uranus-orbit">
            <div class="planet uranus" data-planet="uranus">
                <div class="planet-visual"></div>
            </div>
        </div>

        <div class="orbit neptune-orbit">
            <div class="planet neptune" data-planet="neptune">
                <div class="moon-orbit neptune-moon-orbit">
                    <div class="moon neptune-moon"></div>
                </div>
                <div class="planet-visual"></div>
            </div>
        </div>

    </main>

    <!-- Info Modal -->
    <div id="planet-modal" class="modal">
        <div class="modal-content glass">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-visual">
                    <div id="modal-planet-icon" class="planet-large"></div>
                </div>
                <div class="modal-info">
                    <h2 id="modal-title">Planeta</h2>
                    <p id="modal-description" class="modal-description">Descrição do planeta...</p>

                    <div class="modal-stats">
                        <div class="stat-item">
                            <span class="material-symbols-rounded">public</span>
                            <div class="stat-text">
                                <span class="label">Diâmetro</span>
                                <span class="value" id="modal-diameter">0 km</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <span class="material-symbols-rounded">thermostat</span>
                            <div class="stat-text">
                                <span class="label">Temperatura</span>
                                <span class="value" id="modal-temp">0°C</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <span class="material-symbols-rounded">orbit</span>
                            <div class="stat-text">
                                <span class="label">Ano (Órbita)</span>
                                <span class="value" id="modal-orbit">0 dias</span>
                            </div>
                        </div>
                        <div class="stat-item">
                            <span class="material-symbols-rounded">distance</span>
                            <div class="stat-text">
                                <span class="label">Distância do Sol</span>
                                <span class="value" id="modal-distance">0 Mi km</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/solar-app.js"></script>
</body>

</html>
